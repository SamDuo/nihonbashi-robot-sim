<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nihonbashi Heat Twin — Cesium (energy-block base)</title>
<link rel="stylesheet"
      href="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Widgets/widgets.css">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Cesium.js"></script>
<script src="ion_token.js"></script><!-- gitignored; sets window.ION_TOKEN_OVERRIDE -->
<style>
  html, body { margin:0; padding:0; height:100%; font-family: system-ui, sans-serif; }
  #cesium { position:absolute; inset:0; }
  #status { position:fixed; top:8px; right:8px; max-width:340px; background:rgba(0,0,0,.78);
    color:#fff; padding:6px 10px; border-radius:6px; font-size:11px; line-height:1.4; z-index:1000; white-space:pre-line; }
  .ok{background:rgba(40,130,40,.85)!important} .err{background:rgba(180,40,40,.9)!important}
  #hud { position:fixed; top:8px; left:8px; background:rgba(8,12,18,.82); color:#cfe9f2;
    padding:8px 11px; border-radius:6px; font-size:12px; z-index:1000; min-width:230px; }
  #hud .big{font-size:20px;font-weight:700;color:#fff;line-height:1.1}
  #hud .sub{color:#8fb3c0;font-size:11px;margin-top:3px}
  #heatctl{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(8,12,18,.86);
    padding:7px 14px;border-radius:7px;z-index:1000;color:#cfe9f2;font-size:11px;display:none;align-items:center;gap:12px}
  #heatctl input{width:240px;accent-color:#ff7043}
  #heatctl .bar{display:inline-block;width:120px;height:10px;border-radius:2px;
    background:linear-gradient(90deg,#2b6cff,#13c08a,#ffb347,#ff5436)}
</style>
</head>
<body>
<div id="cesium"></div>
<div id="status">Initializing</div>
<div id="hud">
  <div style="color:#ff7043;font-weight:700;font-size:11px">NIHONBASHI HEAT TWIN · 日本橋</div>
  <div class="big" id="hud-hour">14:00</div>
  <div class="sub" id="hud-idx">heat index —</div>
  <div class="sub" id="hud-scn">scenario —</div>
</div>
<div id="heatctl">
  <span>HEAT HOUR <b id="hh">14</b>:00</span>
  <input id="hslider" type="range" min="0" max="23" value="14">
  <span class="bar"></span><span style="color:#8fb3c0">cool→hot · streets visible through</span>
</div>

<script>
const ION_TOKEN = "YOUR_ION_TOKEN_HERE";
const params = new URLSearchParams(location.search);
const SCENARIO = params.get('scenario') || 'proactive';
const HOUR0 = parseInt(params.get('hour') || '14', 10);
const PLATEAU_PUBLIC = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJiODVhMmQ5OS1hOWZjLTQ3YmYtODlmNi1lNWUwY2MwOGUxYTMiLCJpZCI6MTQ5ODk3LCJpYXQiOjE2ODc5MzQ3NDN9.OG0mc3i7ZxGwHQjlMv3TRjiOvKWpzxglxmJRaUIykTY';
const userToken = params.get('token') || window.ION_TOKEN_OVERRIDE ||
  (ION_TOKEN !== "YOUR_ION_TOKEN_HERE" ? ION_TOKEN : null);
const token = userToken || PLATEAU_PUBLIC;

const $ = id => document.getElementById(id);
const STATUS = $('status');
const setStatus = (m, c) => { STATUS.textContent = m; STATUS.className = c || ''; console.log('[heat-cesium]', m); };
const hcss = (v) => {
  const s = [[43,108,255],[19,192,138],[255,179,71],[255,84,54]];
  const t = Math.max(0, Math.min(1, v / 2.2)), f = t*3, i = Math.min(2, Math.floor(f)), k = f-i, a = s[i], b = s[i+1];
  return `rgb(${a[0]+(b[0]-a[0])*k|0},${a[1]+(b[1]-a[1])*k|0},${a[2]+(b[2]-a[2])*k|0})`;
};

(async () => {
  try {
    Cesium.Ion.defaultAccessToken = token;

    // study-block centroid (drives camera + heat grid anchor) from energy scene
    setStatus('Loading energy scene');
    const scene = await fetch('/energy/energy_scene.json').then(r => r.json());
    const A_LAT = scene.meta.anchor_lat, A_LNG = scene.meta.anchor_lng;
    const MLAT = 111320, MLNG = 111320 * Math.cos(A_LAT * Math.PI / 180);
    const toLL = (x, z) => [A_LNG + x / MLNG, A_LAT + z / MLAT];
    const lats = [], lngs = [];
    const studyPolys = scene.buildings.map(b => {
      const flat = []; b.poly.forEach(([x, z]) => { const [lng, lat] = toLL(x, z); flat.push(lng, lat); lats.push(lat); lngs.push(lng); });
      return { b, flat };
    });
    const cLng = (Math.min(...lngs)+Math.max(...lngs))/2, cLat = (Math.min(...lats)+Math.max(...lats))/2;

    // 403 FIX: ion Bing Aerial w/Labels (asset 3) base — photoreal ground + street labels, no OSM 403
    let baseLayer;
    try { baseLayer = Cesium.ImageryLayer.fromProviderAsync(Cesium.IonImageryProvider.fromAssetId(3)); }
    catch (e) { console.warn('Bing imagery failed', e); }
    let terrainProvider;
    try { terrainProvider = await Cesium.CesiumTerrainProvider.fromIonAssetId(3258112); }
    catch { terrainProvider = new Cesium.EllipsoidTerrainProvider(); }

    const viewer = new Cesium.Viewer('cesium', {
      baseLayer, terrainProvider, baseLayerPicker:false, geocoder:false, homeButton:false,
      sceneModePicker:false, navigationHelpButton:false, timeline:false, animation:false,
      fullscreenButton:false, infoBox:true, selectionIndicator:true,
      requestRenderMode:true, maximumRenderTimeChange:Infinity, useBrowserRecommendedResolution:true,
    });
    // perf (globe stays ON — the heat field drapes on it)
    const sc = viewer.scene;
    sc.requestRenderMode = true; sc.maximumRenderTimeChange = Infinity;
    sc.skyBox = undefined; sc.skyAtmosphere = undefined;
    sc.fog.enabled = false; sc.shadowMap.enabled = false; viewer.shadows = false;
    sc.globe.enableLighting = false; sc.globe.maximumScreenSpaceError = 4; sc.globe.tileCacheSize = 60;
    sc.msaaSamples = 1; sc.postProcessStages.fxaa.enabled = false; sc.highDynamicRange = false;
    const cc = sc.screenSpaceCameraController;
    cc.minimumZoomDistance = 120; cc.maximumZoomDistance = 1200; cc.enableCollisionDetection = true;
    const requestRender = () => sc.requestRender();
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(cLng, cLat - 0.0016, 380),
      orientation: { heading: Cesium.Math.toRadians(10), pitch: Cesium.Math.toRadians(-42), roll: 0 },
    });

    // study buildings (neutral 3D context on the block)
    for (const { b, flat } of studyPolys) viewer.entities.add({
      name: 'Building ' + b.id,
      polygon: { hierarchy: Cesium.Cartesian3.fromDegreesArray(flat),
        material: Cesium.Color.fromCssColorString('#3a4452').withAlpha(0.95),
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
        extrudedHeight: b.height, extrudedHeightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
        outline: true, outlineColor: Cesium.Color.fromCssColorString('#0b1014').withAlpha(0.5) } });

    // ---- heat field overlay: re-anchor the 20x10x50m grid onto the study block ----
    const fr = await fetch(`/twin/frames_${SCENARIO}.json`).then(r => r.json()).catch(() => null);
    if (fr && fr.heat) {
      const GW = 20, GH = 10, CELL = 50;
      const aLng = cLng - (GW * CELL / 2) / MLNG, aLat = cLat - (GH * CELL / 2) / MLAT;
      const rect = Cesium.Rectangle.fromDegrees(aLng, aLat, aLng + GW * CELL / MLNG, aLat + GH * CELL / MLAT);
      const canv = (h) => {
        const c = document.createElement('canvas'); c.width = GW; c.height = GH; const g = c.getContext('2d');
        const H = fr.heat[h];
        for (let x = 0; x < GW; x++) for (let y = 0; y < GH; y++) { g.fillStyle = hcss(H[x][y]); g.fillRect(x, GH-1-y, 1, 1); }
        return c;
      };
      const meanIdx = (h) => { const H = fr.heat[h]; let s = 0, n = 0; for (const col of H) for (const v of col) { s += v; n++; } return s / n; };
      let layer = null;
      async function setHeat(h) {
        const prov = await Cesium.SingleTileImageryProvider.fromUrl(canv(h).toDataURL(), { rectangle: rect });
        const nl = viewer.imageryLayers.addImageryProvider(prov); nl.alpha = 0.62;
        if (layer) viewer.imageryLayers.remove(layer); layer = nl;
        const hh = String(h).padStart(2, '0');
        $('hud-hour').textContent = hh + ':00'; $('hh').textContent = h;
        $('hud-idx').textContent = 'heat index ' + meanIdx(h).toFixed(2) + (meanIdx(h) > 1.5 ? ' ⚠ EXTREME' : '');
        $('hud-scn').textContent = 'scenario: ' + SCENARIO;
        requestRender();
      }
      await setHeat(HOUR0);
      $('heatctl').style.display = 'flex';
      $('hslider').value = HOUR0;
      $('hslider').oninput = (e) => setHeat(+e.target.value);
      setStatus('Heat field on the study block · Bing aerial base · streets visible.', 'ok');
    } else {
      setStatus('Heat data /twin/frames_' + SCENARIO + '.json not found.', 'err');
    }
    requestRender();
  } catch (err) { setStatus('Error: ' + (err.message || err), 'err'); console.error(err); }
})();
</script>
</body>
</html>
